<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>考研笔记</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
</head>
<body>
  <div id="app"></div>
  <script>
    window.$docsify = {
      name: '考研笔记',
      basePath: 'Notes/',
      loadSidebar: '_sidebar.md',
      subMaxLevel: 3,
      auto2top: true,
      search: 'auto'
    };
  </script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-katex@1/dist/docsify-katex.min.js"></script>
  <!-- Mermaid 图表支持 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@9/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default' });
    window.$docsify.plugins = (window.$docsify.plugins || []).concat(function(hook) {
      hook.afterEach(function(html, next) {
        next(html.replace(/<pre[^>]*><code class="lang-mermaid">([\s\S]*?)<\/code><\/pre>/g, '<div class="mermaid">$1</div>'));
      });
      hook.doneEach(function() { mermaid.run(); });
    });
  </script>
  <script>
    // 每日打卡系统（localStorage）
    (function() {
      var key = 'kaoyan_checkin_dates';
      function getDates() {
        try { return JSON.parse(localStorage.getItem(key)) || []; } catch(e) { return []; }
      }
      function saveDates(arr) { localStorage.setItem(key, JSON.stringify(arr)); }
      function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
      }
      function streak(arr) {
        if (!arr.length) return 0;
        var sorted = arr.slice().sort().reverse();
        var td = new Date(); td.setHours(0,0,0,0);
        var count = 0;
        for (var i = 0; i < sorted.length; i++) {
          var d = new Date(sorted[i]); d.setHours(0,0,0,0);
          var diff = (td - d) / 86400000;
          if (diff === count) { count++; }
          else if (diff > count) { break; }
        }
        return count;
      }
      function hasCheckedToday() {
        return getDates().indexOf(todayStr()) >= 0;
      }
      function updateUI() {
        var el = document.getElementById('streak-text');
        if (!el) return;
        var s = streak(getDates());
        el.innerHTML = s > 0 ? '🔥 已连续打卡 <b>' + s + '</b> 天' : '🔥 还没有打卡记录';
        var btn = document.getElementById('checkin-btn');
        if (btn) {
          if (hasCheckedToday()) {
            btn.textContent = '✅ 今日已打卡';
            btn.style.background = '#999';
            btn.disabled = true;
          } else {
            btn.textContent = '📅 今日打卡';
            btn.style.background = '#42b983';
            btn.disabled = false;
          }
        }
        var hint = document.getElementById('checkin-hint');
        if (hint) {
          hint.textContent = hasCheckedToday() ? '明天继续加油！' : '';
        }
      }
      window.doCheckin = function() {
        if (hasCheckedToday()) return;
        var dates = getDates();
        dates.push(todayStr());
        saveDates(dates);
        updateUI();
      };
      // Docsify 动态加载内容，用 MutationObserver 监听 DOM 变化
      var obs = new MutationObserver(function() {
        var streakEl = document.getElementById('streak-text');
        if (streakEl) {
          updateUI();
          // 绑定按钮点击事件（比 inline onclick 更可靠）
          var btn = document.getElementById('checkin-btn');
          if (btn && !btn._bound) {
            btn._bound = true;
            btn.addEventListener('click', doCheckin);
          }
        }
      });
      obs.observe(document.body, { childList: true, subtree: true });
      // 兜底：页面加载完也执行一次
      window.addEventListener('load', function() { updateUI(); });
    })();
  </script>
</body>
</html>
